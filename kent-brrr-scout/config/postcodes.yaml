# Kent BRRR Scout — target geography, cost assumptions and gate thresholds.
# Every number the underwriting engine uses lives here so you can tune without code changes.

# Focus outcodes: used for PropertyData's per-postcode lists, the bundled sample data, and
# coverage.scope = focus. The daily portal search covers all of England (see coverage).
outcodes:
  medway: [ME1, ME2, ME4, ME5, ME7, ME8]
  thanet: [CT8, CT9, CT10, CT11, CT12]

# ---------------------------------------------------------------------------
# Coverage: what the daily portal search looks at.
# scope: england -> the counties below, residential and commercial, newest listings only
#        focus   -> only the focus outcodes above (the original Kent-only behaviour)
# Wales and Scotland are left out until their purchase taxes (LTT, LBTT/ADS) are modelled.
# ---------------------------------------------------------------------------
coverage:
  scope: england
  channels: [residential, commercial]
  added_within_days: 1          # only listings the portal says were added in the last day
  max_pages_per_search: 8       # per county, per channel, per portal (25 listings a page)
  keywords: []                  # e.g. [renovation, modernisation]: narrows residential searches if set
  recheck_days: 14              # a listing seen again at the same price is re-checked after this long
  # Extra searches beyond "new today". reduced/stale/sweep are residential and start on Rightmove only;
  # add a portal to `portals` once its residential_all URL template and sort values are confirmed.
  searches:
    new: {enabled: true}
    reduced: {enabled: true, pages: 2, within_days: 2, portals: [rightmove]}
    stale: {enabled: true, pages: 2, min_days_on_market: 90, cycle_nights: 7, portals: [rightmove]}
    sweep:
      enabled: true
      cycle_nights: 7             # each night searches a different seventh of the counties
      pages_per_search: 4
      portals: [rightmove]
      keywords: [modernisation, renovation, refurbishment, "cash buyers", auction, investment, repossessed, probate]
    # Deep search of existing stock: every residential listing from the last 14 days, a few
    # counties a night, so the whole of England's current stock is read every few nights and
    # again every month (`every_days`). Widens the funnel far beyond "added today".
    backfill:
      enabled: true
      within_days: 14
      counties_per_night: 10
      pages: 8
      every_days: 30
      portals: [rightmove, onthemarket, zoopla]
  search_areas:
    - Bedfordshire
    - Berkshire
    - Bristol
    - Buckinghamshire
    - Cambridgeshire
    - Cheshire
    - Cornwall
    - Cumbria
    - Derbyshire
    - Devon
    - Dorset
    - County Durham
    - East Riding of Yorkshire
    - East Sussex
    - Essex
    - Gloucestershire
    - London
    - Greater Manchester
    - Hampshire
    - Herefordshire
    - Hertfordshire
    - Isle of Wight
    - Kent
    - Lancashire
    - Leicestershire
    - Lincolnshire
    - Merseyside
    - Norfolk
    - North Yorkshire
    - Northamptonshire
    - Northumberland
    - Nottinghamshire
    - Oxfordshire
    - Rutland
    - Shropshire
    - Somerset
    - South Yorkshire
    - Staffordshire
    - Suffolk
    - Surrey
    - Tyne and Wear
    - Warwickshire
    - West Midlands
    - West Sussex
    - West Yorkshire
    - Wiltshire
    - Worcestershire

# Region-wide threshold/cost overrides (same shape as outcode_overrides). For example London
# rarely reaches a 6.8% gross yield; lower it here if you want London deals to pass.
region_overrides: {}

# Optional per-outcode overrides of any key under `thresholds` or `costs`.
outcode_overrides:
  CT9:   # Margate — higher yields, softer ARV evidence
    costs:
      arv_haircut_pct: 0.07
  ME1:
    thresholds:
      min_gross_yield: 0.07

thresholds:
  all_in_cap_pct_of_arv: 0.75        # Gate 1: (price + refurb + SDLT + fixed) <= 75% ARV
  min_gross_yield: 0.068             # Gate 2: annual rent / ARV
  min_net_monthly_cashflow: 0.0      # Gate 3: post-tax SPV cashflow must be > this (GBP / month)
  min_capital_recycled_pct: 0.55     # Gate 4: net refi proceeds / total cash deployed
  min_roce_pct: 0.0                  # default CLI --min-roce
  icr_required: 1.25                 # Ltd-co BTL ICR (informational unless icr_caps_loan)
  icr_stress_rate: 0.055

finance:
  refi_ltv: 0.75
  btl_interest_rate: 0.0525
  operating_cost_drag_pct: 0.22      # management, voids, maintenance, insurance
  corporation_tax_rate: 0.19
  icr_caps_loan: false               # true = refi loan limited by ICR stress test
  refi_fee_pct_of_loan: 0.02         # lender product fee (added to cost, not loan)
  refi_fixed_costs: 1500             # valuation, broker, legal on refinance
  use_bridging: true
  default_plan: bridge_btl_ltd     # the plan alerts and gates use unless a person picks another
  personal_tax_rate: 0.40          # your marginal income tax rate, for plans in your own name
  months_until_refinance: 6        # purchase to refinance (bridge term / interest during works)
  bridging_ltv: 0.70                 # of purchase price
  bridging_monthly_rate: 0.0085
  bridging_arrangement_fee_pct: 0.02
  bridging_exit_fee_pct: 0.01
  bridging_months: 6

costs:
  fixed_acquisition_costs: 3500      # legal, searches, survey, broker on purchase
  sdlt_surcharge_pct: 0.05           # additional dwelling / company surcharge (from 31 Oct 2024)
  refurb_contingency_pct: 0.10
  arv_haircut_pct: 0.05              # conservative discount on blended comps
  rent_haircut_pct: 0.05
  # Refurb cost per sq ft (GBP) by tier — Kent contractor rates, inc. VAT
  refurb_per_sqft:
    light: 18        # paint, carpets, light fittings
    medium: 45       # new kitchen + bathroom, partial rewire, decor
    heavy: 75        # full strip-out, rewire, replumb, heating, windows
    structural: 120  # underpinning, roof, damp tanking, extensions
  refurb_minimum:
    light: 4000
    medium: 15000
    heavy: 30000
    structural: 50000

# Fallback internal floor areas (sq ft) when listing, PropertyData and EPC all fail
default_floor_area_sqft:
  flat: {1: 480, 2: 650, 3: 800}
  terraced: {1: 550, 2: 750, 3: 950, 4: 1150}
  semi-detached: {2: 800, 3: 1000, 4: 1250}
  detached: {2: 900, 3: 1200, 4: 1500, 5: 1900}
  commercial: {0: 1000}

# Eligibility rules (deterministic, applied before any API spend on enrichment)
eligibility:
  allowed_residential_types: [terraced, end-terrace, semi-detached, flat, maisonette]
  min_lease_years_flats: 90
  include_commercial: true          # commercial / mixed-use go through a separate valuation path
  exclude_keywords:
    - retirement
    - over 55
    - over 60
    - age restricted
    - shared ownership
    - houseboat
    - park home
    - mobile home
    - lodge
    - holiday let restriction
    - non-standard construction
    - cash buyers only due to mortgage
    - help to buy only

# Commercial valuation path (rent from £/sq ft, ARV = rent / net initial yield).
# Rough: lookup order is outcode, then region, then default. Treat commercial results as a
# first screen and get a proper valuation before offering.
commercial:
  rent_per_sqft_pa:
    default: 11.0
    ME4: 14.0
    CT9: 11.0
    London: 32.0
    South East: 15.0
    East of England: 13.0
    South West: 12.0
    West Midlands: 11.0
    East Midlands: 10.0
    North West: 10.5
    Yorkshire and the Humber: 9.5
    North East: 8.5
  valuation_yield: 0.085

ingestion:
  propertydata_base_url: https://api.propertydata.co.uk
  # PropertyData /sourced-properties lists to pull per outcode
  sourced_lists:
    - repossessed-properties
    - unmodernised-properties
    - auction-properties
    - reduced-properties
    - cash-buyers-only
  max_price: 350000
  max_price_commercial: 750000
  # Auction / RSS feeds. Any RSS 2.0 / Atom URL. (Clive Emson's /feed/ was removed from their
  # site in 2026 and now returns 404; add another auction house's feed here if you have one.)
  rss_feeds: []
  epc_base_url: https://epc.opendatacommunities.org/api/v1
  land_registry_sparql: https://landregistry.data.gov.uk/landregistry/query
  request_delay_seconds: 0.4        # be polite to rate limits

claude:
  model: claude-opus-5-5
  effort: medium
  max_images: 6

# Portal collector — runs in a real browser on YOUR laptop (see README "Daily laptop run").
# Low volume and slow on purpose: one pass a day, newest listings first, stops at
# listings it has already seen. If a site shows a block/captcha page the collector
# stops for that site and reports it in the UI — it does not try to get around it.
portals:
  enabled: [rightmove, zoopla, onthemarket]
  headless: true                # false = show the browser window while collecting
  browser_channel: chrome       # use installed Google Chrome if present, else bundled Chromium
  max_sale_pages_per_outcode: 3 # newest-first; stops early once pages are all already-seen
  max_rent_pages_per_outcode: 2
  rent_refresh_days: 7          # rental comps don't need refreshing daily
  page_delay_seconds: [4, 9]    # random pause between page loads
  max_detail_pages_per_run: 150 # detail pages only for listings that survive the cheap pre-gate
  stop_after_seen_streak: 12    # consecutive already-seen listings → stop paging that outcode
  base_urls:
    rightmove: https://www.rightmove.co.uk
    rightmove_typeahead: https://los.rightmove.co.uk/typeahead
    zoopla: https://www.zoopla.co.uk
    onthemarket: https://www.onthemarket.com
  # County (area) search URLs. Placeholders: {base} {loc} {slug} {name} {max_price} {index}
  # {page1} {days} {zoopla_added} {otm_added} {kw}. Fix here if a portal changes its URLs.
  area_urls:
    rightmove:
      residential: "{base}/property-for-sale/find.html?locationIdentifier={loc}&maxPrice={max_price}&sortType=6&index={index}&maxDaysSinceAdded={days}&dontShow=retirement%2CsharedOwnership&includeSSTC=false{kw}"
      commercial: "{base}/commercial-property-for-sale/find.html?locationIdentifier={loc}&maxPrice={max_price}&sortType=6&index={index}&maxDaysSinceAdded={days}"
      residential_all: "{base}/property-for-sale/find.html?locationIdentifier={loc}&maxPrice={max_price}&sortType={sort}&index={index}&dontShow=retirement%2CsharedOwnership&includeSSTC=false{kw}"
      sorts: {newest: "6", oldest: "10"}
    zoopla:
      residential: "{base}/for-sale/property/{slug}/?q={name}&results_sort=newest_listings&search_source=refine&price_max={max_price}&added={zoopla_added}&is_retirement_home=false&is_shared_ownership=false&pn={page1}{kw}"
      commercial: "{base}/for-sale/commercial/{slug}/?q={name}&results_sort=newest_listings&price_max={max_price}&added={zoopla_added}&pn={page1}"
    onthemarket:
      residential: "{base}/for-sale/property/{slug}/?max-price={max_price}&sort-field=update_date&recently-added={otm_added}&retirement=false&shared-ownership=false&page={page1}{kw}"
      commercial: "{base}/for-sale/commercial/{slug}/?max-price={max_price}&sort-field=update_date&recently-added={otm_added}&page={page1}"
  # Pin Rightmove location ids here if auto-lookup fails, e.g. ME4: "OUTCODE^1652", Kent: "REGION^61294"
  rightmove_location_ids: {}
  # On-demand comps: for each postcode district where a listing looks promising, read one page
  # of rentals and one of homes for sale (cached), so rent and asking-price comps exist anywhere.
  comps_max_districts_per_run: 120
  comps_rent_cache_days: 30
  comps_sale_cache_days: 14

# Local comps (used when no PROPERTYDATA_API_KEY): asking-price and rent medians built
# from everything the portal collector has seen, plus HM Land Registry sold prices.
local_comps:
  lookback_days: 120
  min_samples: 3
  land_registry_cache_days: 7
  sold_lookback_months: 24

# HM Land Registry Price Paid Data (England and Wales, Open Government Licence), kept locally
# for sold-price comps everywhere. First run downloads the yearly files (~300 MB, a few minutes);
# after that only the monthly update file.
land_registry_ppd:
  enabled: true
  base_url: http://prod.publicdata.landregistry.gov.uk.s3-website-eu-west-1.amazonaws.com
  years: 2                      # current year plus the previous one
  monthly_file: pp-monthly-update-new-version.csv
  refresh_days: 30
  postcodes_io: https://api.postcodes.io

schedule:
  time: "05:30"                 # local time on the laptop; England-wide takes about an hour
  sources: [portals, rss, propertydata]

# ---------------------------------------------------------------------------
# Finance products: YOUR current rates and costs (edit here or in Settings).
# Rates are annual unless named monthly; fees as fractions (0.02 = 2%).
# Defaults keep the original spec's figures (5.25% BTL, 0.85%/month bridge).
# ---------------------------------------------------------------------------
finance_products:
  btl_ltd:        {label: "Buy-to-let mortgage (Ltd company)", ltv: 0.75, rate: 0.0525, fee_pct: 0.02, fixed_costs: 1500, repayment: false, term_years: 25, icr: 1.25, stress_rate: 0.055, erc_pct: 0.0, owner: ltd, kind: btl}
  btl_personal:   {label: "Buy-to-let mortgage (your name)", ltv: 0.75, rate: 0.0495, fee_pct: 0.03, fixed_costs: 1500, repayment: false, term_years: 25, icr: 1.45, stress_rate: 0.055, erc_pct: 0.0, owner: personal, kind: btl}
  commercial_ltd: {label: "Commercial mortgage (Ltd company)", ltv: 0.70, rate: 0.0675, fee_pct: 0.02, fixed_costs: 3000, repayment: true, term_years: 20, icr: 1.0, stress_rate: 0.0675, erc_pct: 0.0, owner: ltd, kind: commercial}
  residential:    {label: "Residential mortgage (you live in it)", ltv: 0.75, rate: 0.044, fee_pct: 0.0, fixed_costs: 1999, repayment: true, term_years: 25, icr: 1.0, stress_rate: 0.044, erc_pct: 0.0, rate_loading: 0.01, owner: personal, kind: residential}
  bridging:       {label: "Bridging loan", ltv: 0.70, monthly_rate: 0.0085, arrangement_fee_pct: 0.02, exit_fee_pct: 0.01, fixed_costs: 0, funds_refurb_pct: 0.0}

# Suggested starting points (researched November 2026; lender pricing moves weekly,
# confirm with a broker). Shown beside each product with a "use suggested" button.
finance_suggested:
  as_of: "November 2026"
  products:
    btl_ltd:        {rate: 0.052, ltv: 0.75, fee_pct: 0.03, fixed_costs: 1500, note: "75% LTV five-year fixes at Accord and The Mortgage Works sit around 5.1-5.2% with a 3-5% fee."}
    btl_personal:   {rate: 0.0495, ltv: 0.75, fee_pct: 0.03, fixed_costs: 1500, icr: 1.45, note: "Usually a little cheaper than company lending; higher-rate taxpayers are tested at 145% ICR."}
    commercial_ltd: {rate: 0.0675, ltv: 0.70, fee_pct: 0.02, fixed_costs: 3000, term_years: 20, note: "Commonly 6-8.5% at 65-75% LTV, on a repayment basis over 15-25 years; personal guarantees are usual."}
    residential:    {rate: 0.044, ltv: 0.75, fee_pct: 0.0, fixed_costs: 1999, note: "75% LTV five-year fixes from mainstream lenders; averages vary by source, so check before relying on it."}
    bridging:       {monthly_rate: 0.0085, ltv: 0.70, arrangement_fee_pct: 0.02, exit_fee_pct: 0.005, fixed_costs: 2000, note: "Standard first-charge bridges run 0.75-1.25% a month, 1-2% arrangement, 0-1% exit, plus legal and valuation."}
  sources:
    - {name: "Property118, Accord rate cuts (Nov 2026)", url: "https://www.property118.com/buy-to-let-mortgage-deals-expand-as-accord-cuts-rates/"}
    - {name: "Mortgage One Finance, TMW rates", url: "https://www.mortgageonefinance.co.uk/the-mortgage-works-mortgage-rates"}
    - {name: "Spark Finance bridging rate index (2026)", url: "https://www.sparkfinance.co.uk/data/bridging-loan-rate-index"}
    - {name: "Capitalise, bridging loan rates 2026", url: "https://capitalise.com/gb/insights/property-finance/bridging-loan-rates"}
    - {name: "Funding Guru, commercial mortgage rates 2026", url: "https://fundingguru.com/?p=39509"}

# Ways to fund a deal: how you buy it, then what you refinance onto.
finance_plans:
  - {id: bridge_btl_ltd,      short: "Bridge → Ltd BTL",      label: "Bridge, then Ltd buy-to-let",           purchase: bridging,     refinance: btl_ltd}
  - {id: cash_btl_ltd,        short: "Cash → Ltd BTL",        label: "Cash, then Ltd buy-to-let",             purchase: cash,         refinance: btl_ltd}
  - {id: btl_ltd_day_one,     short: "Ltd BTL from day one",  label: "Ltd buy-to-let from day one",           purchase: btl_ltd,      refinance: btl_ltd, note: "Most lenders won't lend on a property that's unmortgageable before the works."}
  - {id: bridge_btl_personal, short: "Bridge → BTL own name", label: "Bridge, then buy-to-let in your name",  purchase: bridging,     refinance: btl_personal}
  - {id: btl_personal_day_one, short: "BTL own name",         label: "Buy-to-let in your name from day one",  purchase: btl_personal, refinance: btl_personal}
  - {id: bridge_commercial,   short: "Bridge → Commercial",   label: "Bridge, then commercial mortgage (Ltd)", purchase: bridging,    refinance: commercial_ltd}
  - {id: residential,         short: "Residential",           label: "Residential mortgage, live in then let", purchase: residential, refinance: residential, main_residence: true, note: "Assumes it's your main home when you buy (no stamp duty surcharge) and that your lender agrees consent to let, which adds the rate loading."}
  - {id: cash_only,           short: "All cash",              label: "All cash, no mortgage",                  purchase: cash,        refinance: none}

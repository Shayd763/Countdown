[project]
name = "kent-brrr-scout"
version = "0.1.0"
description = "Deal-scouting & deterministic BRRR underwriting agent for Medway (ME) and Thanet (CT)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "anthropic>=2.0",
    "sqlite-utils>=3.36",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
brrr-scout = "src.main:main"
brrr-web = "src.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM105"]  # FastAPI Query() defaults; explicit try/except-pass is clearer here

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # fixture data tables
"tests/*" = ["E501"]

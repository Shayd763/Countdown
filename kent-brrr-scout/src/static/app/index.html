<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b6e6e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BRRR Scout" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" href="/icons/icon-192.png" />
<title>BRRR Scout</title>
<style>
:root {
  --bg: #f3f5f7; --card: #ffffff; --ink: #11161d; --muted: #616b7a; --line: #e3e7ec;
  --accent: #0b6e6e; --accent-ink: #fff; --accent-soft: #e2f1f0;
  --pass: #157347; --pass-bg: #e3f3ea; --fail: #b42318; --fail-bg: #fdeceb; --warn: #8a5a00; --warn-bg: #fff2cf;
  --chip: #edf0f4; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.06);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1014; --card: #171b21; --ink: #e9ecf1; --muted: #9aa4b2; --line: #272d36;
    --accent: #33b8ad; --accent-ink: #052421; --accent-soft: #10302d;
    --pass: #4cc38a; --pass-bg: #132d1f; --fail: #ff7b6b; --fail-bg: #3a1916; --warn: #f2c14e; --warn-bg: #362b10;
    --chip: #222831; --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Roboto, "Segoe UI", sans-serif;
  padding-bottom: calc(72px + var(--safe-b)); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 12px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  padding: calc(10px + var(--safe-t)) 16px 10px; display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; flex: 1; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--card);
  border: 1px solid var(--line); }
.page { padding: 4px 16px 24px; max-width: 640px; margin: 0 auto; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabs[hidden] { display: none; }
.tabs a { flex: 1; text-align: center; padding: 9px 0 8px; color: var(--muted); font-size: 11px; font-weight: 600; }
.tabs a svg { display: block; margin: 0 auto 2px; width: 24px; height: 24px; }
.tabs a.on { color: var(--accent); }

/* banners & chips */
.banner { border-radius: 14px; padding: 10px 12px; margin: 8px 0 12px; font-size: 13px; display: block; }
.banner.offline { background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--accent-soft); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; background: var(--chip);
  font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.scrollx { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.scrollx::-webkit-scrollbar { display: none; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.p-pass { background: var(--pass-bg); color: var(--pass); } .p-fail { background: var(--fail-bg); color: var(--fail); }
.p-warn { background: var(--warn-bg); color: var(--warn); } .p-neutral { background: var(--chip); color: var(--muted); }
.p-accent { background: var(--accent-soft); color: var(--accent); }

/* today */
.hello { font-size: 14px; color: var(--muted); margin: 2px 0 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.stat { background: var(--card); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 24px; letter-spacing: -.02em; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.good b { color: var(--pass); }
h2.sec { font-size: 17px; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: baseline; letter-spacing: -.01em; }
h2.sec small { font-size: 13px; font-weight: 500; color: var(--muted); }

/* deal card */
.dcard { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 14px; display: block; color: inherit; }
.dcard .ph { position: relative; aspect-ratio: 16/8; background: var(--chip) center/cover no-repeat; }
.dcard .ph .pill { position: absolute; top: 10px; left: 10px; }
.dcard .ph .roce { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.dcard .body { padding: 12px 14px 14px; }
.dcard .addr { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.dcard .sub { font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
.grid4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tile { background: var(--bg); border-radius: 12px; padding: 9px 10px; }
.tile span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.tile b { font-size: 17px; letter-spacing: -.01em; }
.tile.good b { color: var(--pass); } .tile.bad b { color: var(--fail); }
.offer { margin-top: 10px; padding: 9px 10px; background: var(--warn-bg); color: var(--warn); border-radius: 12px; font-size: 13px; font-weight: 600; }

/* compact list */
.row { display: flex; gap: 12px; background: var(--card); border-radius: 16px; padding: 10px; margin-bottom: 10px; box-shadow: var(--shadow); color: inherit; align-items: center; }
.row .th { width: 74px; height: 74px; border-radius: 12px; background: var(--chip) center/cover; flex: none; position: relative; }
.row .th i { position: absolute; left: 6px; bottom: 6px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--card); }
.row .mid { flex: 1; min-width: 0; }
.row .a { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .l { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .k { font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { text-align: right; flex: none; }
.row .r b { display: block; font-size: 16px; }
.dot-pass { background: var(--pass); } .dot-fail { background: var(--fail); } .dot-neutral { background: var(--muted); }
.searchbar { display: flex; gap: 8px; margin: 4px 0 10px; }

/* detail */
.hero { position: relative; aspect-ratio: 4/3; max-height: 46vh; width: 100%; background: var(--chip) center/cover; }
.hero.noimg { aspect-ratio: auto; height: calc(120px + var(--safe-t)); background: linear-gradient(135deg, var(--accent), #0a4f57); }
.dcard .ph.noimg { aspect-ratio: auto; height: 54px; background: linear-gradient(135deg, var(--accent-soft), var(--chip)); }
.hero .back, .hero .share { position: absolute; top: calc(10px + var(--safe-t)); width: 40px; height: 40px; border-radius: 50%;
  background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center; }
.hero .back { left: 12px; } .hero .share { right: 12px; }
.verdict { border-radius: 16px; padding: 12px 14px; margin: -26px 0 12px; position: relative; font-weight: 700; box-shadow: var(--shadow); }
.verdict.ok { background: var(--pass-bg); color: var(--pass); } .verdict.no { background: var(--fail-bg); color: var(--fail); }
.verdict.mid { background: var(--warn-bg); color: var(--warn); }
.verdict small { display: block; font-weight: 500; opacity: .9; margin-top: 2px; }
.box { background: var(--card); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.box h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
.line { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.line:last-child { border: none; }
.line span:first-child { color: var(--muted); }
.line span:last-child { white-space: nowrap; padding-left: 10px; text-align: right; }
.line.total { font-weight: 800; font-size: 16px; } .line.total span:first-child { color: var(--ink); }
.gate { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-size: 14px; }
.gate i { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 800; }
.gate.ok i { background: var(--pass-bg); color: var(--pass); } .gate.no i { background: var(--fail-bg); color: var(--fail); }
input[type=range] { padding: 0; border: none; background: none; accent-color: var(--accent); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 11px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }

/* forms / me */
.field { margin: 10px 0; } .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.switch { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 12px; }
.switch:last-child { border: none; }
.toggle { position: relative; width: 50px; height: 30px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .2s; }
.toggle span::after { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle input:checked + span { background: var(--accent); } .toggle input:checked + span::after { transform: translateX(20px); }

/* login */
.login { max-width: 400px; margin: 0 auto; padding: calc(40px + var(--safe-t)) 22px 40px; }
.login .logo { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 14px; }
.login h1 { text-align: center; margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; }
.err { color: var(--fail); font-size: 14px; min-height: 20px; margin: 6px 0; }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 20px 20px 0 0;
  max-height: 86vh; overflow: auto; padding: 8px 16px calc(20px + var(--safe-b)); transform: translateY(105%); transition: transform .22s ease; }
.sheet { visibility: hidden; } .sheet.open { transform: none; visibility: visible; } .sheet-bg.open { display: block; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; z-index: 30; font-size: 14px; display: none; max-width: 90vw; text-align: center; }
.toast.on { display: block; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.skeleton { background: linear-gradient(90deg, var(--chip), var(--card), var(--chip)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 18px; height: 260px; margin-bottom: 14px; }
@keyframes sk { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="view"></div>
<nav class="tabs" id="tabs" hidden>
  <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</a>
  <a href="#/deals" data-tab="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Deals</a>
  <a href="#/me" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Alerts &amp; me</a>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= helpers ======================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gbp = (x) => x == null || isNaN(x) ? "–" : (x < 0 ? "−£" : "£") + Math.abs(Math.round(x)).toLocaleString("en-GB");
const gbpk = (x) => x == null || isNaN(x) ? "–" : Math.abs(x) >= 100000 ? (x < 0 ? "−£" : "£") + (Math.abs(x) / 1000).toFixed(0) + "k" : gbp(x);
const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const roce = (x) => x == null ? "∞" : x.toFixed(0) + "%";
const when = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "–";
const GATE = { all_in_cap: "75% all-in cap", gross_yield: "Gross yield", net_cashflow: "Net cashflow", capital_recycled: "Capital recycled" };
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function toast(msg, ms = 3000) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms); }

const state = { user: null, offline: false, cachedAt: null, filters: null };
const DEFAULT_FILTERS = { outcodes: [], category: "residential", passOnly: true, sort: "roce_pct", q: "", maxCash: "", minRoce: "" };
try { state.filters = { ...DEFAULT_FILTERS, ...JSON.parse(localStorage.getItem("brrr-mf") || "{}") }; } catch { state.filters = { ...DEFAULT_FILTERS }; }
const saveFilters = () => { try { localStorage.setItem("brrr-mf", JSON.stringify(state.filters)); } catch {} };

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts,
    body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body });
  if (res.headers.get("X-From-Cache")) { state.offline = true; state.cachedAt = res.headers.get("X-Cached-At"); }
  else if (res.headers.get("X-Offline")) { state.offline = true; }
  else if (res.ok) { state.offline = false; }
  const data = (res.headers.get("content-type") || "").includes("json") ? await res.json() : await res.text();
  if (res.status === 401 && !path.startsWith("/api/auth/")) { state.user = null; location.hash = "#/login"; throw new Error("Sign in required"); }
  if (!res.ok) throw new Error((data && data.detail) || res.statusText);
  return data;
}
function offlineBanner() {
  return state.offline ? `<div class="banner offline">⚡ Laptop not reachable — showing saved data${state.cachedAt ? " from " + when(state.cachedAt) : ""}.</div>` : "";
}
function setTabs(active) {
  $("#tabs").hidden = !active;
  document.querySelectorAll(".tabs a").forEach((a) => a.classList.toggle("on", a.dataset.tab === active));
}
function render(html) { $("#view").innerHTML = html; window.scrollTo(0, 0); }

/* ======================= router ======================= */
const routes = [
  [/^#\/login/, viewLogin], [/^#\/today/, viewToday], [/^#\/deals/, viewDeals],
  [/^#\/deal\/(.+)$/, viewDeal], [/^#\/me/, viewMe],
];
async function route() {
  const h = location.hash || "#/today";
  if (!state.user && !h.startsWith("#/login")) {
    try { const s = await api("/api/auth/status"); state.user = s.user; } catch {}
    if (!state.user) {
      // offline but previously signed in: let cached screens render
      try { const me = await api("/api/auth/me"); state.user = me; } catch { location.hash = "#/login"; return; }
    }
  }
  for (const [re, fn] of routes) { const m = h.match(re); if (m) return fn(...m.slice(1).map(decodeURIComponent)); }
  location.hash = "#/today";
}
addEventListener("hashchange", route);
// Installed apps have no pull-to-refresh: refresh lists when the app comes back to the foreground.
let lastShown = Date.now();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { lastShown = Date.now(); return; }
  if (Date.now() - lastShown > 30000 && /^#\/(today|deals)/.test(location.hash || "#/today")) route();
});

/* ======================= login ======================= */
async function viewLogin() {
  setTabs(null);
  let setup = false;
  try { setup = (await api("/api/auth/status")).setup_needed; } catch {}
  render(`<div class="login">
    <img class="logo" src="/icons/icon-192.png" alt="">
    <h1>${setup ? "Create your profile" : "Sign in"}</h1>
    <p class="muted" style="text-align:center;margin:0 0 18px">${setup ? "This becomes the owner account for your BRRR Scout." : "Kent BRRR Scout — Medway &amp; Thanet"}</p>
    <form id="f">
      ${setup ? `<div class="field"><label>Your name</label><input name="name" autocomplete="name" required></div>` : ""}
      <div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input name="password" type="password" autocomplete="${setup ? "new-password" : "current-password"}" minlength="8" required></div>
      <div class="err" id="err"></div>
      <button class="btn primary block" type="submit">${setup ? "Create profile" : "Sign in"}</button>
    </form>
    ${!isStandalone() ? `<p class="small muted" style="text-align:center;margin-top:22px">${isIOS() ? "Tip: tap <b>Share → Add to Home Screen</b> to install the app (needed for notifications on iPhone)." : "Tip: use your browser menu → <b>Install app</b> / <b>Add to Home screen</b>."}</p>` : ""}
  </div>`);
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    try {
      const r = await api(setup ? "/api/auth/setup" : "/api/auth/login", { method: "POST", body: fd });
      state.user = r.user;
      const next = new URLSearchParams(location.hash.split("?")[1] || "").get("next");
      if (next && next.startsWith("/") && !next.startsWith("//")) location.href = next; else location.hash = "#/today";
    } catch (err) { $("#err").textContent = err.message; }
  };
}

/* ======================= cards ======================= */
function verdictPill(d) {
  if (!d.eligible) return `<span class="pill p-neutral">Ineligible</span>`;
  return d.passed ? `<span class="pill p-pass">✓ Passes all 4</span>` : `<span class="pill p-fail">✗ Fails</span>`;
}
function bigCard(d, near) {
  const img = d.image ? `style="background-image:url('${esc(d.image)}')"` : "";
  return `<a class="dcard" href="#/deal/${encodeURIComponent(d.listing_id)}">
    <div class="ph ${d.image ? "" : "noimg"}" ${img}>${near ? `<span class="pill p-warn">Negotiable</span>` : verdictPill(d)}<span class="roce">ROCE ${roce(near ? d.at_offer_roce : d.roce_pct)}</span></div>
    <div class="body">
      <div class="addr">${esc(d.address)}</div>
      <div class="sub">${esc(d.property_type)}${d.bedrooms ? " · " + d.bedrooms + " bed" : ""} · ${esc(d.outcode)} · asking <b class="num" style="color:var(--ink)">${gbp(d.asking_price)}</b>${d.is_auction ? " · auction" : ""}${d.price_drop_pct ? ` · <span style="color:var(--warn)">−${d.price_drop_pct.toFixed(0)}%</span>` : ""}</div>
      <div class="grid4 num">
        <div class="tile"><span>Cash to buy</span><b>${gbp(d.cash_to_buy)}</b></div>
        <div class="tile"><span>Refinance</span><b>${gbp(d.refi_loan)}</b></div>
        <div class="tile ${(near ? d.at_offer_money_left_in : d.money_left_in) <= 0 ? "good" : ""}"><span>Money left in</span><b>${gbp(near ? d.at_offer_money_left_in : d.money_left_in)}</b></div>
        <div class="tile ${(near ? d.at_offer_cashflow : d.net_monthly_cashflow) > 0 ? "good" : "bad"}"><span>Cashflow / mo</span><b>${gbp(near ? d.at_offer_cashflow : d.net_monthly_cashflow)}</b></div>
      </div>
      ${near ? `<div class="offer">Works if you offer ${gbp(d.max_offer_price)} — ${d.offer_gap_pct.toFixed(0)}% under asking</div>` : ""}
    </div></a>`;
}
function rowCard(d) {
  const cls = !d.eligible ? "dot-neutral" : d.passed ? "dot-pass" : "dot-fail";
  return `<a class="row" href="#/deal/${encodeURIComponent(d.listing_id)}">

async function pushState() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !window.isSecureContext) return { supported: false };
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return { supported: true, sub, permission: Notification.permission };
}
async function enablePush() {
  if (isIOS() && !isStandalone()) throw new Error("On iPhone, first add the app to your Home Screen (Share → Add to Home Screen), then open it from there.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Notifications are blocked — allow them in your phone's settings for this app.");
  const { key } = await api("/api/push/key");
  const reg = await navigator.serviceWorker.ready;
  const raw = Uint8Array.from(atob(key.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((key.length + 3) % 4)), (c) => c.charCodeAt(0));
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw });
  await api("/api/push/subscribe", { method: "POST", body: sub.toJSON() });
}
async function disablePush() {
  const { sub } = await pushState();
  if (sub) { await api("/api/push/unsubscribe", { method: "POST", body: { endpoint: sub.endpoint } }).catch(() => {}); await sub.unsubscribe(); }
}

async function viewMe() {
  setTabs("me");
  render(`<div class="top"><h1>Alerts &amp; me</h1></div><div class="page"><div class="skeleton" style="height:180px"></div></div>`);
  let me, meta = null, settings = null;
  try { me = await api("/api/auth/me"); state.user = me; } catch (e) { return; }
  try { meta = await api("/api/meta"); } catch {}
  if (me.is_admin) { try { settings = await api("/api/settings"); } catch {} }
  const p = me.prefs;
  const ps = await pushState().catch(() => ({ supported: false }));
  const groups = meta ? meta.outcodes : {};
  const sched = settings?.schedule;
  render(`<div class="top"><h1>Alerts &amp; me</h1></div>
  <div class="page">
    ${offlineBanner()}
    ${!isStandalone() && isIOS() ? `<div class="banner info">📲 Install the app: tap <b>Share</b> → <b>Add to Home Screen</b>. iPhone only allows notifications for installed apps.</div>` : ""}
    <div class="box"><h3>Daily notification</h3>
      <div class="switch"><div><b>Notifications on this phone</b><div class="small muted">${!ps.supported ? (window.isSecureContext ? "Not supported in this browser." : "Needs the secure (https) address — see the laptop's Settings → Phone app.") : ps.sub ? "On" : ps.permission === "denied" ? "Blocked in phone settings" : "Off"}</div></div>
        <label class="toggle"><input type="checkbox" id="pushT" ${ps.sub ? "checked" : ""} ${!ps.supported ? "disabled" : ""}><span></span></label></div>
      <div class="field"><label>Send me the morning digest</label><select id="notify">
        <option value="always" ${p.notify === "always" ? "selected" : ""}>Every morning</option>
        <option value="passes" ${p.notify === "passes" ? "selected" : ""}>Only when a deal passes</option>
        <option value="off" ${p.notify === "off" ? "selected" : ""}>Never</option></select></div>
      ${me.is_admin ? `<div class="field"><label>Scan &amp; notify at (laptop time)</label><div style="display:flex;gap:8px"><input type="time" id="time" value="${esc(settings?.config?.schedule?.time || "07:30")}"><button class="btn" id="timeSave">Set</button></div>
        <div class="tiny muted" style="margin-top:4px">${sched ? (sched.installed ? `Daily run installed on your ${esc(sched.platform)} laptop at ${esc(sched.time)}.` : "The daily run isn't installed on the laptop yet — tap Set.") : ""}</div></div>` : ""}
      <button class="btn block" id="testPush" ${ps.sub ? "" : "disabled"}>Send me today's digest now</button>
    </div>

    <div class="box"><h3>What counts as a deal for me</h3>
      ${Object.entries(groups).map(([g, codes]) => `<div class="field"><label>${g[0].toUpperCase() + g.slice(1)} postcodes <span class="tiny">(none selected = all)</span></label><div class="chips">${codes.map((c) => `<button class="chip ${p.outcodes.includes(c) ? "on" : ""}" data-oc="${c}">${c}</button>`).join("")}</div></div>`).join("")}
      <div class="field"><label>Property categories</label><div class="chips">${["residential","commercial","mixed-use"].map((c) => `<button class="chip ${p.categories.includes(c) ? "on" : ""}" data-cat="${c}" style="text-transform:capitalize">${c}</button>`).join("")}</div></div>
      <div class="field"><label>Max cash I can put in (£)</label><input type="number" id="maxCash" inputmode="numeric" step="5000" placeholder="any" value="${p.max_cash_in ?? ""}"></div>
      <div class="field"><label>Min return on cash left in — ROCE (%)</label><input type="number" id="minRoce" inputmode="numeric" placeholder="any" value="${p.min_roce ?? ""}"></div>
      <div class="switch"><div><b>Only new listings</b><div class="small muted">Digest shows deals first seen in the latest scan</div></div><label class="toggle"><input type="checkbox" id="onlyNew" ${p.only_new ? "checked" : ""}><span></span></label></div>
      <button class="btn primary block" id="savePrefs" style="margin-top:8px">Save</button>
    </div>

    ${me.is_admin ? `<div class="box"><h3>Scan now</h3><div class="small muted" style="margin-bottom:8px">Runs on your laptop (portals take a while). Notifications aren't sent for manual scans.</div>
      <button class="btn block" id="scanNow">Start a scan</button><div class="small muted" id="scanMsg" style="margin-top:6px"></div></div>` : ""}

    <div class="box"><h3>Profile</h3>
      <div class="field"><label>Name</label><input id="name" value="${esc(me.name)}"></div>
      <div class="small muted">${esc(me.email)}${me.is_admin ? " · owner" : ""}</div>
      <details style="margin-top:10px"><summary class="small">Change password</summary>
        <div class="field"><label>Current password</label><input type="password" id="pw0" autocomplete="current-password"></div>
        <div class="field"><label>New password</label><input type="password" id="pw1" autocomplete="new-password" minlength="8"></div>
        <button class="btn" id="pwSave">Update password</button></details>
      <button class="btn block" id="logout" style="margin-top:14px;color:var(--fail)">Sign out</button>
    </div>
    <p class="tiny muted" style="text-align:center">Kent BRRR Scout · your data stays on your laptop</p>
  </div>`);

  const pushT = $("#pushT");
  if (pushT) pushT.onchange = async () => {
    try { if (pushT.checked) { await enablePush(); toast("Notifications on"); } else { await disablePush(); toast("Notifications off"); } viewMe(); }
    catch (e) { pushT.checked = !pushT.checked; toast(e.message, 6000); }
  };
  $("#testPush").onclick = async () => { try { const r = await api("/api/push/test", { method: "POST" }); toast(r.message); } catch (e) { toast(e.message, 5000); } };
  document.querySelectorAll("[data-oc],[data-cat]").forEach((b) => b.onclick = () => b.classList.toggle("on"));
  $("#savePrefs").onclick = async () => {
    const prefs = {
      notify: $("#notify").value,
      outcodes: [...document.querySelectorAll("[data-oc].on")].map((b) => b.dataset.oc),
      categories: [...document.querySelectorAll("[data-cat].on")].map((b) => b.dataset.cat),
      max_cash_in: $("#maxCash").value ? Number($("#maxCash").value) : null,
      min_roce: $("#minRoce").value ? Number($("#minRoce").value) : null,
      only_new: $("#onlyNew").checked,
    };
    try { state.user = await api("/api/auth/me", { method: "PUT", body: { prefs, name: $("#name").value } }); toast("Saved"); } catch (e) { toast(e.message); }
  };
  $("#notify").onchange = () => $("#savePrefs").click();
  if ($("#timeSave")) $("#timeSave").onclick = async () => {
    try { const r = await api("/api/schedule/install", { method: "POST", body: { time: $("#time").value } }); toast(r.message, 5000); viewMe(); }
    catch (e) { toast(e.message, 6000); }
  };
  if ($("#scanNow")) $("#scanNow").onclick = async () => {
    try { await api("/api/scan", { method: "POST", body: { sources: null } }); $("#scanMsg").textContent = "Scan started…"; pollScan(); }
    catch (e) { toast(e.message); }
  };
  $("#pwSave").onclick = async () => { try { await api("/api/auth/me", { method: "PUT", body: { password: $("#pw1").value, current_password: $("#pw0").value } }); toast("Password updated — sign in again"); location.hash = "#/login"; } catch (e) { toast(e.message); } };
  $("#logout").onclick = async () => {
    await disablePush().catch(() => {});
    await api("/api/auth/logout", { method: "POST" }).catch(() => {});
    try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
    state.user = null; location.hash = "#/login";
  };
}
async function pollScan() {
  try {
    const j = await api("/api/job");
    const el = $("#scanMsg");
    if (j && j.running) { if (el) el.textContent = j.message; setTimeout(pollScan, 2000); }
    else if (j && el) el.textContent = j.error ? "Failed: " + j.error : `Done: ${j.result.fetched} listings, ${j.result.passed} pass.`;
  } catch {}
}

/* ======================= boot ======================= */
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
route();
</script>
</body>
</html>

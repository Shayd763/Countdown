<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Gatehouse" />
<meta name="description" content="BRRR deals across England, checked every morning: cost to buy, refinance and cashflow for each." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" href="/icons/icon-192.png" />
<title>Gatehouse</title>
<style>
/* ---------- tokens: iOS system colours, one radius scale, one glass recipe ---------- */
:root {
  --bg: #f2f2f7; --cell: #ffffff; --cell-hi: #e5e5ea;
  --label: #000000; --label-2: rgba(60, 60, 67, .62); --label-3: rgba(60, 60, 67, .32);
  --sep: rgba(60, 60, 67, .2); --fill: rgba(118, 118, 128, .12); --fill-2: rgba(118, 118, 128, .2);
  --tint: #007aff; --green: #34c759; --green-text: #248a3d; --red: #ff3b30; --red-text: #d70015;
  --orange: #ff9500; --orange-text: #b45309;
  --glass: rgba(255, 255, 255, .58); --glass-strong: rgba(255, 255, 255, .78);
  --glass-edge: rgba(255, 255, 255, .7); --glass-hi: rgba(255, 255, 255, .95); --glass-lo: rgba(0, 0, 0, .04);
  --glass-shadow: 0 8px 28px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .08);
  --r-xl: 26px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --ease: cubic-bezier(.2, .8, .2, 1); --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --cell: #1c1c1e; --cell-hi: #2c2c2e;
    --label: #ffffff; --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .62); --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .36);
    --tint: #0a84ff; --green: #30d158; --green-text: #30d158; --red: #ff453a; --red-text: #ff6961;
    --orange: #ff9f0a; --orange-text: #ffb340;
    --glass: rgba(44, 44, 48, .5); --glass-strong: rgba(44, 44, 48, .72);
    --glass-edge: rgba(255, 255, 255, .12); --glass-hi: rgba(255, 255, 255, .22); --glass-lo: rgba(0, 0, 0, .3);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 2px rgba(0, 0, 0, .4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; color: var(--label); background: var(--bg); min-height: 100vh;
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Roboto, "Segoe UI", sans-serif;
  letter-spacing: -.01em; -webkit-font-smoothing: antialiased; padding-bottom: calc(108px + var(--safe-b)); }
body.no-tabs { padding-bottom: calc(32px + var(--safe-b)); }
a { color: var(--tint); text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--label); letter-spacing: inherit; }
svg.i { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.rnd { font-family: var(--round); }
.l2 { color: var(--label-2); } .l3 { color: var(--label-3); }
.fn { font-size: 13px; line-height: 1.35; letter-spacing: 0; }
.sub { font-size: 15px; line-height: 1.33; }
.green { color: var(--green-text); } .red { color: var(--red-text); } .orange { color: var(--orange-text); }

/* ---------- glass ---------- */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(1.9); backdrop-filter: blur(22px) saturate(1.9);
  border: .5px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo), var(--glass-shadow);
}
.gbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--label);
  transition: transform .12s var(--ease); }
.gbtn:active { transform: scale(.9); }
.gbtn.on-photo { color: #fff; background: rgba(30, 30, 30, .28); border-color: rgba(255, 255, 255, .3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 6px 20px rgba(0, 0, 0, .25); }
.chip-glass { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px;
  font-size: 13px; font-weight: 600; letter-spacing: 0; color: #fff; background: rgba(20, 20, 22, .32);
  -webkit-backdrop-filter: blur(16px) saturate(1.8); backdrop-filter: blur(16px) saturate(1.8);
  border: .5px solid rgba(255, 255, 255, .28); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.g { background: var(--green); } .dot.r { background: var(--red); } .dot.o { background: var(--orange); } .dot.n { background: var(--label-3); }

/* ---------- navigation bar with large title ---------- */
.nav { position: sticky; top: 0; z-index: 10; height: calc(54px + var(--safe-t)); padding: var(--safe-t) 16px 0;
  display: grid; grid-template-columns: 88px 1fr 88px; align-items: center; transition: background .2s, box-shadow .2s; }
.nav.scrolled { background: color-mix(in srgb, var(--bg) 72%, transparent);
  -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); box-shadow: 0 .5px 0 var(--sep); }
.nav .ct { text-align: center; font-weight: 600; font-size: 17px; opacity: 0; transition: opacity .18s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav.scrolled .ct { opacity: 1; }
.nav .right { display: flex; gap: 8px; justify-content: flex-end; }
.lt { padding: 0 20px 4px; }
.lt h1 { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.025em; margin: 0; }
.lt p { margin: 4px 0 0; color: var(--label-2); font-size: 15px; }
.page { padding: 0 16px; max-width: 680px; margin: 0 auto; }

/* ---------- floating glass tab bar ---------- */
.tabbar { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--safe-b));
  width: min(92vw, 400px); height: 64px; border-radius: 32px; display: flex; padding: 5px; }
.tabbar[hidden] { display: none; }
.tabbar a { flex: 1; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: var(--label); font-size: 10.5px; font-weight: 600; letter-spacing: 0; transition: background .2s var(--ease), color .2s; }
.tabbar a svg { width: 25px; height: 25px; }
.tabbar a.on { color: var(--tint); background: var(--fill); }
.tabbar a:active { transform: scale(.94); }

/* ---------- grouped lists ---------- */
.gh { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 28px 4px 10px; display: flex; justify-content: space-between; align-items: baseline; }
.gh a, .gh button { font-size: 15px; font-weight: 400; color: var(--tint); letter-spacing: -.01em; }
.gh-sm { font-size: 13px; color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; margin: 26px 16px 7px; font-weight: 400; }
.group { background: var(--cell); border-radius: var(--r-xl); overflow: hidden; }
.gf { font-size: 13px; color: var(--label-2); margin: 7px 16px 0; line-height: 1.38; letter-spacing: 0; }
.cell { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 11px 16px; position: relative; color: var(--label); width: 100%; text-align: left; }
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); border-top: .5px solid var(--sep); }
a.cell:active, button.cell:active, label.cell:active { background: var(--cell-hi); }
.cell .grow { flex: 1; min-width: 0; }
.cell .val { color: var(--label-2); text-align: right; white-space: nowrap; }
.cell .val.strong { color: var(--label); font-weight: 600; }
.cell.total { font-weight: 600; }
.cell.total .val { color: var(--label); font-weight: 700; }
.cell .chev { width: 14px; height: 14px; color: var(--label-3); stroke-width: 2.6; }
.icn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.icn svg { width: 18px; height: 18px; stroke-width: 2.2; }
.cell input, .cell select { border: 0; background: none; text-align: right; color: var(--label-2); padding: 0; min-width: 0; outline: none; }
.cell select { -webkit-appearance: none; appearance: none; color: var(--tint); }
.cell input::placeholder { color: var(--label-3); }
.cell input[type=number], .cell input[type=time] { width: 112px; flex: none; }
.cell input#name { width: 55%; flex: none; }
.cell textarea { width: 100%; border: 0; background: none; min-height: 88px; resize: none; outline: none; padding: 0; line-height: 1.4; }

/* ---------- switch, segmented control, slider ---------- */
.sw { position: relative; width: 51px; height: 31px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 16px; background: var(--fill-2); transition: background .22s var(--ease); }
.sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 3px 1px rgba(0, 0, 0, .06); transition: transform .22s var(--ease); }
.sw input:checked + i { background: var(--green); }
.sw input:checked + i::after { transform: translateX(20px); }
.sw input:disabled + i { opacity: .45; }
.seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; position: relative; }
.seg button { flex: 1; height: 32px; border-radius: 8px; font-size: 13px; font-weight: 500; letter-spacing: 0; position: relative; z-index: 1; white-space: nowrap; padding: 0 6px; }
.seg button.on { background: var(--cell); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04); }
@media (prefers-color-scheme: dark) { .seg button.on { background: #636366; } }
input[type=range].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: none; margin: 6px 0; }
input[type=range].slider::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
  background: linear-gradient(to right, var(--tint) var(--p, 50%), var(--fill-2) var(--p, 50%)); }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -12px; border-radius: 50%;
  background: #fff; box-shadow: 0 .5px 4px rgba(0, 0, 0, .12), 0 6px 13px rgba(0, 0, 0, .12); }
input[type=range].slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--fill-2); }
input[type=range].slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--tint); }
input[type=range].slider::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 6px 13px rgba(0, 0, 0, .15); }

/* ---------- buttons ---------- */
.btn { height: 50px; border-radius: 25px; padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 17px; font-weight: 600; transition: transform .12s var(--ease), opacity .12s; }
.btn:active { transform: scale(.97); }
.btn.fill { background: var(--tint); color: #fff; }
.btn.tinted { background: color-mix(in srgb, var(--tint) 15%, transparent); color: var(--tint); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; }
.capsule { height: 34px; padding: 0 14px; border-radius: 17px; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
  background: var(--fill); color: var(--label); transition: transform .12s var(--ease); white-space: nowrap; }
.capsule:active { transform: scale(.95); }
.capsule.on { background: var(--label); color: var(--bg); }
.rowx { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.rowx::-webkit-scrollbar { display: none; }

/* ---------- finance plan picker ---------- */
.planbar { margin: 12px 0 2px; }
.planbar .lbl { font-size: 13px; color: var(--label-2); margin: 0 4px 7px; letter-spacing: 0; display: flex; justify-content: space-between; }
.planbar .lbl a { color: var(--tint); }
.planbar .capsule.on { background: var(--tint); color: #fff; }
.plan-row .grow b { font-weight: 600; display: block; }
.plan-row.cur { background: color-mix(in srgb, var(--tint) 9%, var(--cell)); }
.field-grid .cell input { width: 96px; }
.unit { color: var(--label-3); font-size: 15px; margin-left: 4px; min-width: 22px; }
.sugg { font-size: 12px; color: var(--label-2); letter-spacing: 0; display: block; margin-top: 2px; }

/* ---------- funnel ---------- */
.funnel-line { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px 14px; border-top: .5px solid var(--sep); font-size: 13px; color: var(--label-2); letter-spacing: 0; width: 100%; text-align: left; }
.funnel-line b { color: var(--label); font-weight: 600; }
.fbar { padding: 9px 16px; }
.fbar .top { display: flex; justify-content: space-between; font-size: 15px; }
.fbar .track { height: 6px; border-radius: 3px; background: var(--fill); margin-top: 6px; overflow: hidden; }
.fbar .track i { display: block; height: 100%; border-radius: 3px; background: var(--tint); }
.fbar.good .track i { background: var(--green); } .fbar.warn .track i { background: var(--orange); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0; padding: 1px 6px; border-radius: 6px; margin-left: 4px; vertical-align: 1px; }
.tag.cut { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange-text); }
.tag.old { background: var(--fill); color: var(--label-2); }

/* ---------- deal cards ---------- */
.card { display: block; background: var(--cell); border-radius: var(--r-xl); overflow: hidden; color: var(--label); margin-bottom: 14px;
  transition: transform .14s var(--ease); }
.card:active { transform: scale(.98); }
.photo { position: relative; aspect-ratio: 16 / 10; background: var(--fill) center / cover no-repeat; }
.photo.none { background: linear-gradient(150deg, color-mix(in srgb, var(--tint) 16%, var(--cell)), var(--fill-2)); display: grid; place-items: center; }
.photo.none svg { width: 54px; height: 54px; stroke-width: 1.3; color: var(--label-3); }
.photo .tl { position: absolute; top: 12px; left: 12px; } .photo .tr { position: absolute; top: 12px; right: 12px; }
.card .meta { padding: 14px 16px 4px; }
.card .t { font-size: 19px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.card .s { font-size: 15px; color: var(--label-2); margin-top: 3px; }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); margin: 12px 16px 0; padding: 12px 0 0; border-top: .5px solid var(--sep); }
.figs > div + div { border-left: .5px solid var(--sep); padding-left: 12px; }
.figs span { display: block; font-size: 12px; color: var(--label-2); letter-spacing: 0; }
.figs b { display: block; font-family: var(--round); font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.card .foot { padding: 10px 16px 15px; font-size: 13px; color: var(--label-2); letter-spacing: 0; }
.card .foot b { color: var(--label); font-weight: 600; }
.card .offer { color: var(--orange-text); }

/* ---------- list rows ---------- */
.lrow { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; color: var(--label); position: relative; }
.lrow + .lrow::before { content: ""; position: absolute; top: 0; right: 0; left: 86px; border-top: .5px solid var(--sep); }
.lrow:active { background: var(--cell-hi); }
.thumb { width: 64px; height: 64px; border-radius: 12px; background: var(--fill) center / cover; flex: none; display: grid; place-items: center; }
.thumb svg { width: 26px; height: 26px; color: var(--label-3); stroke-width: 1.5; }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .a { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; }
.lrow .b, .lrow .c { font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0; margin-top: 2px; }
.lrow .c b { color: var(--label); font-weight: 600; }
.lrow .p { text-align: right; flex: none; }
.lrow .p b { display: block; font-family: var(--round); font-weight: 600; font-size: 16px; }
.lrow .p span { font-size: 12px; color: var(--label-2); }

/* ---------- search ---------- */
.search { display: flex; align-items: center; gap: 6px; height: 38px; border-radius: 12px; background: var(--fill); padding: 0 10px; margin: 6px 0 12px; color: var(--label-2); }
.search svg { width: 18px; height: 18px; }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; min-width: 0; color: var(--label); }
.search input::placeholder { color: var(--label-2); }

/* ---------- detail ---------- */
.hero { position: relative; height: min(52vh, 420px); background: var(--fill) center / cover no-repeat; }
.hero.none { height: calc(150px + var(--safe-t)); background: linear-gradient(160deg, color-mix(in srgb, var(--tint) 22%, var(--bg)), var(--bg)); }
.hero .bar { position: absolute; top: calc(8px + var(--safe-t)); left: 16px; right: 16px; display: flex; justify-content: space-between; }
.hero .bar .gbtn:not(.on-photo) { color: var(--label); }
.sheet-top { position: relative; margin-top: -28px; background: var(--bg); border-radius: 28px 28px 0 0; padding: 22px 16px 0; }
.dt { font-size: 28px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; margin: 0 4px; }
.ds { color: var(--label-2); font-size: 15px; margin: 5px 4px 18px; }
.verdict { display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
.verdict .vi { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.verdict .vi svg { width: 22px; height: 22px; stroke-width: 2.4; }
.vi.g { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green-text); }
.vi.r { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red-text); }
.vi.o { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange-text); }
.verdict b { display: block; font-size: 17px; }
.verdict span { font-size: 13px; color: var(--label-2); letter-spacing: 0; line-height: 1.35; display: block; margin-top: 2px; }
.bignum { padding: 16px 16px 14px; }
.bignum span { font-size: 13px; color: var(--label-2); letter-spacing: 0; }
.bignum b { display: block; font-family: var(--round); font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; margin-top: 2px; font-variant-numeric: tabular-nums; }
.group .figs { margin: 0 16px; padding: 12px 0 14px; }
.gates .cell { align-items: flex-start; }
.gates .cell svg { width: 20px; height: 20px; stroke-width: 2.6; margin-top: 1px; }
.offerbox { padding: 16px; }
.offerbox .o { display: flex; justify-content: space-between; align-items: baseline; }
.offerbox .o b { font-family: var(--round); font-size: 32px; font-weight: 700; letter-spacing: -.03em; }
.result { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 10px; align-items: center; padding: 14px 16px; border-top: .5px solid var(--sep); }
.result span { display: block; font-size: 12px; color: var(--label-2); letter-spacing: 0; }
.result b { font-family: var(--round); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pass-badge { height: 28px; border-radius: 14px; padding: 0 11px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; letter-spacing: 0; }
.pass-badge.g { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green-text); }
.pass-badge.r { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red-text); }
details.more summary { list-style: none; cursor: pointer; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] .chev { transform: rotate(90deg); }
.actions { display: flex; gap: 10px; margin-top: 20px; }
.actions .btn { flex: 1; }

/* ---------- today summary ---------- */
.summary { padding: 18px 18px 16px; }
.summary .lead { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.22; }
.summary .lead em { font-style: normal; color: var(--green-text); }
.summary .lead em.o { color: var(--orange-text); }
.summary p { margin: 8px 0 0; color: var(--label-2); font-size: 15px; line-height: 1.38; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-lg); margin: 4px 0 14px; font-size: 14px; line-height: 1.38; letter-spacing: 0; }
.notice svg { width: 20px; height: 20px; margin-top: 1px; }
.notice.warn { background: color-mix(in srgb, var(--orange) 14%, var(--cell)); color: var(--orange-text); }
.notice.info { background: var(--cell); color: var(--label); }

/* ---------- avatar, login ---------- */
.avatar { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 22px; color: #fff;
  background: linear-gradient(180deg, #a5abb6, #858a94); flex: none; letter-spacing: 0; }
.login { max-width: 420px; margin: 0 auto; padding: calc(64px + var(--safe-t)) 16px 40px; }
.login .appicon { width: 92px; height: 92px; border-radius: 22px; display: block; margin: 0 auto 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .18); }
.login h1 { text-align: center; font-size: 28px; font-weight: 700; letter-spacing: -.025em; margin: 0; }
.login .intro { text-align: center; color: var(--label-2); margin: 6px 12px 26px; font-size: 15px; line-height: 1.38; }
.login .cell input { text-align: left; color: var(--label); }
.err { color: var(--red-text); font-size: 14px; min-height: 22px; margin: 10px 16px 6px; letter-spacing: 0; }

/* ---------- sheet & toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .28); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease-sheet); }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 41; left: 8px; right: 8px; bottom: calc(8px + var(--safe-b)); max-height: 84vh; overflow: auto; border-radius: 34px;
  padding: 8px 16px 18px; transform: translateY(calc(100% + 40px)); transition: transform .42s var(--ease-sheet); visibility: hidden;
  background: var(--glass-strong); }
.sheet.open { transform: none; visibility: visible; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 0 auto 10px; }
.sheet h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 2px 4px 12px; display: flex; justify-content: space-between; align-items: center; }
.sheet .group { background: var(--cell); }
.toast { position: fixed; z-index: 60; left: 50%; top: calc(10px + var(--safe-t)); transform: translate(-50%, -140%); transition: transform .4s var(--ease-sheet);
  border-radius: 24px; padding: 11px 18px; font-size: 15px; font-weight: 600; max-width: 90vw; text-align: center; display: flex; gap: 8px; align-items: center; }
.toast.on { transform: translate(-50%, 0); }
.toast svg { width: 18px; height: 18px; }
.empty { text-align: center; padding: 48px 24px; color: var(--label-2); font-size: 15px; line-height: 1.4; }
.empty svg { width: 44px; height: 44px; stroke-width: 1.4; color: var(--label-3); display: block; margin: 0 auto 12px; }
.skel { border-radius: var(--r-xl); background: var(--cell); height: 300px; margin-bottom: 14px; position: relative; overflow: hidden; }
.skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, var(--fill) 50%, transparent 70%); animation: sk 1.3s linear infinite; }
@keyframes sk { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; animation: none !important; } }
@media (min-width: 700px) { .figs b { font-size: 21px; } }
</style>

<body>
<header class="nav" id="nav"><div class="left" id="navL"></div><div class="ct" id="navT"></div><div class="right" id="navR"></div></header>
<div id="view"></div>
<nav class="tabbar glass" id="tabs" hidden aria-label="Sections">
  <a href="#/today" data-tab="today"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>Today</a>
  <a href="#/deals" data-tab="deals"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Deals</a>
  <a href="#/me" data-tab="me"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Alerts</a>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script>
/* ======================= icons (Lucide-style line set) ======================= */
const P = {
  refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
  sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  share: '<path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  seal: '<path d="M12 2.5 14.4 4.3l3-.2.8 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.8 2.9-3-.2L12 21.5l-2.4-1.8-3 .2-.8-2.9-2.5-1.7 1-2.8-1-2.8 2.5-1.7.8-2.9 3 .2z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  tag: '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1"/>',
  octagon: '<path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/><path d="M15 9l-6 6M9 9l6 6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  house: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M10 21v-6h4v6"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  send: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  map: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  ext: '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
  pin: '<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12"/><circle cx="12" cy="10" r="2.5"/>',
  layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/>',
  pound: '<path d="M18 7c0-5.3-8-5.3-8 0v10"/><path d="M6 13h8"/><path d="M6 21h12"/>',
  percent: '<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  spark: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
  laptop: '<rect x="4" y="4" width="16" height="11" rx="2"/><path d="M2 20h20"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  wifi: '<path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.3-1.7"/><path d="M12 20h0"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h0"/>',
  plus: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>',
};
const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ======================= helpers ======================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gbp = (x) => x == null || isNaN(x) ? "–" : (x < 0 ? "−£" : "£") + Math.abs(Math.round(x)).toLocaleString("en-GB");
const gbpk = (x) => x == null || isNaN(x) ? "–" : Math.abs(x) >= 100000 ? (x < 0 ? "−£" : "£") + (Math.abs(x) / 1000).toFixed(0) + "k" : gbp(x);
const gk = (x) => x == null || isNaN(x) ? "–" : Math.abs(x) >= 10000 ? (x < 0 ? "−£" : "£") + Math.round(Math.abs(x) / 1000) + "k" : gbp(x);
const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const roce = (x) => x == null ? "∞" : x.toFixed(0) + "%";
const day = () => new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
const hm = (iso) => iso ? new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
const when = (iso) => {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yest = new Date(now - 864e5).toDateString() === d.toDateString();
  return sameDay ? `today at ${hm(iso)}` : yest ? `yesterday at ${hm(iso)}` : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + ` at ${hm(iso)}`;
};
const TYPE = { terraced: "terrace", "end-terrace": "end terrace", "semi-detached": "semi", flat: "flat", maisonette: "maisonette", detached: "detached", bungalow: "bungalow", commercial: "commercial unit", "mixed-use": "shop with flat", unknown: "property" };
const what = (d) => `${d.bedrooms ? d.bedrooms + " bed " : ""}${TYPE[d.property_type] || d.property_type}`;
const GATE = { all_in_cap: "All-in under 75% of value", gross_yield: "Gross yield", net_cashflow: "Cashflow after tax", capital_recycled: "Cash back at refinance" };
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function toast(msg, icon = "check", ms = 2600) {
  const t = $("#toast"); t.innerHTML = ic(icon) + `<span>${esc(msg)}</span>`; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms);
}

const state = { user: null, offline: false, cachedAt: null, filters: null, finance: null };
async function finance(force = false) {
  if (!state.finance || force) { try { state.finance = await api("/api/finance"); } catch { state.finance = state.finance || { plans: [], my_plan: null }; } }
  return state.finance;
}
const myPlan = () => (state.user && state.user.prefs && state.user.prefs.plan) || (state.finance && state.finance.default_plan) || null;
function planBar(f, current) {
  if (!f.plans || !f.plans.length) return "";
  return `<div class="planbar"><div class="lbl"><span>Financing</span>${state.user && state.user.is_admin ? `<a href="#/me" onclick="sessionStorage.setItem('openRates','1')">Rates</a>` : ""}</div>
    <div class="rowx" id="planbar">${f.plans.map((p) => `<button class="capsule ${p.id === current ? "on" : ""}" data-plan="${p.id}" title="${esc(p.label)}">${esc(p.short)}</button>`).join("")}</div></div>`;
}
function bindPlanBar(rerender) {
  const bar = $("#planbar"); if (!bar) return;
  const on = bar.querySelector(".on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  bar.onclick = async (e) => {
    const b = e.target.closest("[data-plan]"); if (!b) return;
    $$("#planbar .capsule").forEach((x) => x.classList.toggle("on", x === b));
    try { state.user = await api("/api/auth/me", { method: "PUT", body: { prefs: { plan: b.dataset.plan } } }); } catch {}
    rerender();
  };
}
const DEFAULT_FILTERS = { regions: [], areas: [], postcode: "", ptypes: [], signals: [], category: "residential", passOnly: true, sort: "roce_pct", q: "", maxCash: "", minRoce: "" };
const PTYPES = [["terraced", "Terrace"], ["end-terrace", "End terrace"], ["semi-detached", "Semi"], ["detached", "Detached"], ["bungalow", "Bungalow"], ["flat", "Flat"], ["maisonette", "Maisonette"], ["commercial", "Commercial unit"], ["mixed-use", "Shop and flat"]];
let GEO = null;
async function geo() { if (!GEO) { try { GEO = await api("/api/geo"); } catch { GEO = { regions: [], tree: [] }; } } return GEO; }
function placeLabel(f) {
  const bits = [...f.regions, ...f.areas, ...(f.postcode ? f.postcode.split(",").map((x) => x.trim()).filter(Boolean) : [])];
  return bits.length > 3 ? `${bits.slice(0, 3).join(", ")} +${bits.length - 3}` : bits.join(", ");
}
try { state.filters = { ...DEFAULT_FILTERS, ...JSON.parse(localStorage.getItem("brrr-mf") || "{}") }; } catch { state.filters = { ...DEFAULT_FILTERS }; }
if (Array.isArray(state.filters.outcodes) && state.filters.outcodes.length && !state.filters.postcode) state.filters.postcode = state.filters.outcodes.join(", ");
delete state.filters.outcodes;
["regions", "areas", "ptypes", "signals"].forEach((k) => { if (!Array.isArray(state.filters[k])) state.filters[k] = []; });
const saveFilters = () => { try { localStorage.setItem("brrr-mf", JSON.stringify(state.filters)); } catch {} };

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts,
    body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body });
  if (res.headers.get("X-From-Cache")) { state.offline = true; state.cachedAt = res.headers.get("X-Cached-At"); }
  else if (res.headers.get("X-Offline")) { state.offline = true; }
  else if (res.ok) { state.offline = false; }
  const data = (res.headers.get("content-type") || "").includes("json") ? await res.json() : await res.text();
  if (res.status === 401 && !path.startsWith("/api/auth/")) { state.user = null; location.hash = "#/login"; throw new Error("Sign in required"); }
  if (!res.ok) throw new Error((data && data.detail) || res.statusText);
  return data;
}
function offlineNotice() {
  return state.offline ? `<div class="notice warn">${ic("wifi")}<div>Your laptop isn't reachable, so this is the copy saved ${state.cachedAt ? when(state.cachedAt) : "earlier"}.</div></div>` : "";
}

/* chrome: nav bar, tab bar, large-title collapse */
function chrome({ tab = null, title = "", left = "", right = "", hideNav = false } = {}) {
  $("#tabs").hidden = !tab;
  document.body.classList.toggle("no-tabs", !tab);
  $$("#tabs a").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  const nav = $("#nav"); nav.hidden = hideNav; nav.classList.remove("scrolled");
  $("#navT").textContent = title; $("#navL").innerHTML = left; $("#navR").innerHTML = right;
}
addEventListener("scroll", () => { const n = $("#nav"); if (!n.hidden) n.classList.toggle("scrolled", scrollY > 36); }, { passive: true });
function render(html) { $("#view").innerHTML = html; window.scrollTo(0, 0); }
const largeTitle = (t, sub = "") => `<div class="lt"><h1>${esc(t)}</h1>${sub ? `<p>${sub}</p>` : ""}</div>`;
const gb = (icon, label, attrs = "") => `<button class="gbtn glass" aria-label="${label}" ${attrs}>${ic(icon)}</button>`;

/* ======================= router ======================= */
const routes = [
  [/^#\/login/, viewLogin], [/^#\/today/, viewToday], [/^#\/deals/, viewDeals],
  [/^#\/deal\/(.+)$/, viewDeal], [/^#\/me/, viewMe],
];
async function route() {
  const h = location.hash || "#/today";
  if (!state.user && !h.startsWith("#/login")) {
    try { const s = await api("/api/auth/status"); state.user = s.user; } catch {}
    if (!state.user) {
      try { state.user = await api("/api/auth/me"); } catch { location.hash = "#/login"; return; }
    }
  }
  closeSheet();
  for (const [re, fn] of routes) { const m = h.match(re); if (m) return fn(...m.slice(1).map(decodeURIComponent)); }
  location.hash = "#/today";
}
addEventListener("hashchange", route);
let lastHidden = Date.now();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { lastHidden = Date.now(); return; }
  if (Date.now() - lastHidden > 30000 && /^#\/(today|deals)/.test(location.hash || "#/today")) route();
});

/* ======================= sign in ======================= */
async function viewLogin() {
  chrome({ hideNav: true });
  let setup = false;
  try { setup = (await api("/api/auth/status")).setup_needed; } catch {}
  render(`<div class="login">
    <img class="appicon" src="/icons/icon-192.png" alt="">
    <h1>${setup ? "Create your profile" : "Gatehouse"}</h1>
    <p class="intro">${setup ? "You'll be the owner. You can add someone else later from the laptop." : "Sign in to see this morning's deals across England."}</p>
    <form id="f" novalidate>
      <div class="group">
        ${setup ? `<label class="cell"><input name="name" autocomplete="name" placeholder="Your name" aria-label="Your name" required></label>` : ""}
        <label class="cell"><input name="email" type="email" inputmode="email" autocomplete="username" placeholder="Email" aria-label="Email" required></label>
        <label class="cell"><input name="password" type="password" autocomplete="${setup ? "new-password" : "current-password"}" placeholder="Password${setup ? " (8 or more characters)" : ""}" aria-label="Password" minlength="8" required></label>
      </div>
      <div class="err" id="err"></div>
      <button class="btn fill block" type="submit">${setup ? "Create profile" : "Sign in"}</button>
    </form>
    ${!isStandalone() ? `<p class="gf" style="text-align:center;margin-top:28px">${isIOS() ? `To install, tap ${ic("share", "i fn-i")} Share, then Add to Home Screen. iPhone sends notifications only to installed apps.` : "To install, open the browser menu and choose Install app."}</p>` : ""}
  </div>`);
  $$(".fn-i").forEach((s) => { s.style.cssText = "width:15px;height:15px;vertical-align:-2px"; });
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    if (!fd.email || !fd.password) { $("#err").textContent = "Enter your email and password."; return; }
    try {
      const r = await api(setup ? "/api/auth/setup" : "/api/auth/login", { method: "POST", body: fd });
      state.user = r.user;
      const next = new URLSearchParams(location.hash.split("?")[1] || "").get("next");
      if (next && next.startsWith("/") && !next.startsWith("//")) location.href = next; else location.hash = "#/today";
    } catch (err) { $("#err").textContent = err.message; }
  };
}

/* ======================= cards ======================= */
function photo(d, cls = "photo") {
  return d.image ? `<div class="${cls}" style="background-image:url('${esc(d.image)}')">` : `<div class="${cls} none">${ic("house")}`;
}
function dealCard(d, near = false) {
  const left = near ? d.at_offer_money_left_in : d.money_left_in;
  const cash = near ? d.at_offer_cashflow : d.net_monthly_cashflow;
  const status = near ? `<span class="chip-glass"><i class="dot o"></i>Offer ${gbp(d.max_offer_price)}</span>`
    : d.passed ? `<span class="chip-glass"><i class="dot g"></i>Passes</span>` : `<span class="chip-glass"><i class="dot r"></i>Fails</span>`;
  return `<a class="card" href="#/deal/${encodeURIComponent(d.listing_id)}">
    ${photo(d)}<span class="tl">${status}</span><span class="tr chip-glass">ROCE ${roce(near ? d.at_offer_roce : d.roce_pct)}</span></div>
    <div class="meta"><div class="t">${esc(d.address)}</div>
      <div class="s">${esc(what(d))} in ${esc(d.outcode)}${d.region ? `, ${esc(d.region)}` : ""} · ${near ? "asking " : ""}${gbp(d.asking_price)}${d.is_auction ? " at auction" : ""}</div></div>
    <div class="figs">
      <div><span>Cash to buy</span><b>${gbpk(d.cash_to_buy)}</b></div>
      <div><span>Refinance</span><b>${gbpk(d.refi_loan)}</b></div>
      <div><span>Per month</span><b class="${cash > 0 ? "green" : "red"}">${gbp(cash)}</b></div>
    </div>
    <div class="foot">${near ? `<span class="offer">Asking is ${d.offer_gap_pct.toFixed(0)}% too high.</span> At the offer, ${left <= 0 ? "all" : ""}` : (left <= 0 ? "All" : "")}${left <= 0 ? ` your cash comes back at refinance, plus <b>${gbp(-left)}</b>.` : ` <b>${gbp(left)}</b> stays in the deal after refinance.`}</div>
  </a>`;
}
function listRow(d) {
  const dot = !d.eligible ? "n" : d.passed ? "g" : "r";
  return `<a class="lrow" href="#/deal/${encodeURIComponent(d.listing_id)}">
    <div class="thumb" ${d.image ? `style="background-image:url('${esc(d.image)}')"` : ""}>${d.image ? "" : ic("house")}</div>
    <div class="grow">
      <div class="a"><i class="dot ${dot}"></i><span style="overflow:hidden;text-overflow:ellipsis">${esc(d.address || d.postcode)}</span></div>
      <div class="b">${esc(what(d))} · ${esc(d.outcode)} · ${esc(d.refurb_tier)} refurb${d.status !== "new" ? " · " + esc(d.status) : ""}${d.price_drop_pct || d.reduced_on ? `<span class="tag cut">Cut${d.price_drop_pct ? " " + d.price_drop_pct.toFixed(0) + "%" : ""}</span>` : ""}${d.days_on_market >= 90 ? `<span class="tag old">${d.days_on_market}d</span>` : ""}</div>
      <div class="c num">${gk(d.cash_to_buy)} in · refi ${gk(d.refi_loan)} · <b class="${d.net_monthly_cashflow > 0 ? "green" : "red"}">${gbp(d.net_monthly_cashflow)}</b>/mo</div>
    </div>
    <div class="p"><b>${gk(d.asking_price)}</b><span>${roce(d.roce_pct)} ROCE</span></div>
  </a>`;
}

/* ======================= today ======================= */
async function viewToday() {
  const right = gb("refresh", "Refresh", 'onclick="route()"');

async function pushState() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !window.isSecureContext) return { supported: false };
  const reg = await navigator.serviceWorker.ready;
  return { supported: true, sub: await reg.pushManager.getSubscription(), permission: Notification.permission };
}
async function enablePush() {
  if (isIOS() && !isStandalone()) throw new Error("Add the app to your Home Screen first, then open it from there.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Notifications are off for this app in your phone's Settings.");
  const { key } = await api("/api/push/key");
  const reg = await navigator.serviceWorker.ready;
  const raw = Uint8Array.from(atob(key.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((key.length + 3) % 4)), (ch) => ch.charCodeAt(0));
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw });
  await api("/api/push/subscribe", { method: "POST", body: sub.toJSON() });
}
async function disablePush() {
  const { sub } = await pushState();
  if (sub) { await api("/api/push/unsubscribe", { method: "POST", body: { endpoint: sub.endpoint } }).catch(() => {}); await sub.unsubscribe(); }
}

    await disablePush().catch(() => {});
    await api("/api/auth/logout", { method: "POST" }).catch(() => {});
    try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
    state.user = null; location.hash = "#/login";
  };
}
/* ---------- finance rates editor ---------- */
const MORTGAGE_FIELDS = [
  ["rate", "Interest rate", "%", 100, 2], ["ltv", "Loan to value", "%", 100, 0], ["fee_pct", "Arrangement fee", "%", 100, 2],
  ["fixed_costs", "Valuation, legal and broker", "£", 1, 0], ["term_years", "Term", "yrs", 1, 0],
  ["icr", "Rent cover needed (ICR)", "%", 100, 0], ["stress_rate", "Stress test rate", "%", 100, 2],
  ["erc_pct", "Early repayment charge", "%", 100, 2], ["rate_loading", "Consent-to-let loading", "%", 100, 2],
];
const BRIDGE_FIELDS = [
  ["monthly_rate", "Monthly interest", "%", 100, 2], ["ltv", "Loan to purchase price", "%", 100, 0],
  ["arrangement_fee_pct", "Arrangement fee", "%", 100, 2], ["exit_fee_pct", "Exit fee", "%", 100, 2],
  ["fixed_costs", "Valuation and legal", "£", 1, 0], ["funds_refurb_pct", "Share of refurb it funds", "%", 100, 0],
];
const fmtField = (v, scale, dp) => v == null ? "" : +(v * scale).toFixed(dp);
function productSummary(key, pr) {
  if (key === "bridging") return `${fmtField(pr.monthly_rate, 100, 2)}% a month · ${fmtField(pr.ltv, 100, 0)}% · ${fmtField(pr.arrangement_fee_pct, 100, 1)}% fee`;
  return `${fmtField(pr.rate, 100, 2)}% · ${fmtField(pr.ltv, 100, 0)}% LTV · ${pr.fee_pct ? fmtField(pr.fee_pct, 100, 1) + "% fee" : gbp(pr.fixed_costs) + " fees"} · ${pr.repayment ? "repayment" : "interest only"}`;
}
async function openRates() {
  const f = await finance(true);
  const sug = (f.suggested && f.suggested.products) || {};
  const order = ["btl_ltd", "btl_personal", "commercial_ltd", "residential", "bridging"].filter((k) => f.products[k]);
  openSheet(`<h2>Rates and costs<button class="gbtn glass" id="rx" aria-label="Close">${ic("x")}</button></h2>
    <div class="group">${order.map((k) => {
      const pr = f.products[k], sg = sug[k] || {}, rateKey = k === "bridging" ? "monthly_rate" : "rate";
      const differs = sg[rateKey] != null && Math.abs(sg[rateKey] - pr[rateKey]) > 1e-9;
      return `<button class="cell" data-prod="${k}"><div class="grow"><div style="font-weight:600">${esc(pr.label)}</div><span class="fn l2 num">${productSummary(k, pr)}</span>${differs ? `<span class="sugg">Suggested ${fmtField(sg[rateKey], 100, 2)}%${k === "bridging" ? " a month" : ""}</span>` : ""}</div>${ic("chev", "i chev")}</button>`; }).join("")}</div>
    <p class="gf">Suggested values were checked in ${esc(f.suggested?.as_of || "")}. Lenders reprice often, so use your broker's quotes when you have them.</p>
    ${(f.suggested?.sources || []).length ? `<p class="gf">Sources: ${f.suggested.sources.map((src) => `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.name)}</a>`).join(", ")}</p>` : ""}`);
  $("#rx").onclick = closeSheet;
  $$("#sheet [data-prod]").forEach((b) => b.onclick = () => openProduct(b.dataset.prod));
}
async function openProduct(key) {
  const f = state.finance, pr = f.products[key], sg = (f.suggested?.products || {})[key] || {};
  const fields = (key === "bridging" ? BRIDGE_FIELDS : MORTGAGE_FIELDS).filter(([k]) => k in pr);
  openSheet(`<h2><button class="gbtn glass" id="pb" aria-label="Back">${ic("back")}</button><span style="flex:1;margin-left:10px;font-size:18px">${esc(pr.label)}</span></h2>
    ${sg.note ? `<p class="gf" style="margin:0 4px 12px">${esc(sg.note)}</p>` : ""}
    <div class="group field-grid">${fields.map(([k, label, unit, scale, dp]) => `<label class="cell"><span class="grow">${label}${sg[k] != null ? `<span class="sugg">Suggested ${unit === "£" ? gbp(sg[k]) : fmtField(sg[k], scale, dp) + (unit === "yrs" ? " years" : unit)}</span>` : ""}</span>${unit === "£" ? `<span class="unit">£</span>` : ""}<input type="number" inputmode="decimal" step="any" data-k="${k}" data-scale="${scale}" value="${fmtField(pr[k], scale, dp)}" aria-label="${label}">${unit !== "£" ? `<span class="unit">${unit}</span>` : ""}</label>`).join("")}
      ${"repayment" in pr ? `<label class="cell"><span class="grow">Repayment mortgage<span class="sugg">Off means interest only</span></span><span class="sw"><input type="checkbox" id="rep" ${pr.repayment ? "checked" : ""}><i></i></span></label>` : ""}
    </div>
    <div class="actions">${Object.keys(sg).some((k) => k in pr) ? `<button class="btn tinted" id="useSug">Use suggested</button>` : ""}<button class="btn fill" id="saveProd">Save</button></div>`);
  $("#pb").onclick = openRates;
  if ($("#useSug")) $("#useSug").onclick = () => {
    $$("#sheet [data-k]").forEach((inp) => { const k = inp.dataset.k; if (sg[k] != null) inp.value = +(sg[k] * Number(inp.dataset.scale)).toFixed(4); });
    toast("Suggested values filled in. Save to use them.", "info");
  };
  $("#saveProd").onclick = async () => {
    const vals = {};
    $$("#sheet [data-k]").forEach((inp) => { if (inp.value !== "") vals[inp.dataset.k] = Number(inp.value) / Number(inp.dataset.scale); });
    if ($("#rep")) vals.repayment = $("#rep").checked;
    try { state.finance = { ...state.finance, ...(await api("/api/finance", { method: "PUT", body: { products: { [key]: vals } } })) }; toast(`${pr.label} saved`); openRates(); }
    catch (e) { toast(e.message, "info", 5000); }
  };
}

async function pollScan() {
  try {
    const j = await api("/api/job"), el = $("#scanMsg");
    if (j && j.running) { if (el) { const mins = Math.max(0, Math.round((Date.now() - new Date(j.started_at)) / 60000)); el.textContent = `Scanning · ${mins < 60 ? mins + " min" : Math.floor(mins / 60) + "h " + (mins % 60) + "m"}`; el.title = j.message || ""; } if (el && document.body.contains(el)) setTimeout(pollScan, 5000); }
    else if (j && el && j.kind === "scan") el.textContent = j.error ? "Failed" : (j.result ? `${j.result.passed} pass` : "");
    if (j && !j.running && j.kind === "scan" && !j.error && j.result && pollScan.watching) toast(`Scan finished: ${j.result.fetched} listings, ${j.result.passed} pass`);
    pollScan.watching = !!(j && j.running);
  } catch {}
}

/* ======================= boot ======================= */
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
route();
</script>
</body>

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-engine"
version = "0.1.0"
description = "Daily engine that finds inside-IR35 UK contract roles and generates bespoke Harvard-format CVs, ready to apply."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.28",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cv-engine = "cv_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_engine = ["templates/*"]
